services:
  # Backend Persistent Web Service on Render
  - type: web
    name: network-troubleshooting-assistant-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
        # Example: mongodb+srv://<username>:<password>@cluster0.mongodb.net/network_assistant?retryWrites=true&w=majority
      - key: FRONTEND_URL
        value: https://network-troubleshooting-assistant-frontend.vercel.app
